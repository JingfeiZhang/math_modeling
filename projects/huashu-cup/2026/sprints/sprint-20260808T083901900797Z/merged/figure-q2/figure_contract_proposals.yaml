  rasterized_layers: []
  review_risks:
  - Cumulative normalization emphasizes the horizon-wide comparison and can hide local
    regional or hourly variation.
  - The figure reports the cost comparison only; carbon, latency, and fixed-schedule
    stress probes remain separate evidence.
  - The main method is a bounded deterministic rolling exchange heuristic, not a global
    or MILP-optimal solution.
  - A lower cumulative cost does not establish causal attribution or transfer to altered
    inputs.
