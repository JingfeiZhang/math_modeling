  outputs:
    pdf: paper/figures/fig_q2_dispatch_comparison.pdf
    svg: paper/figures/fig_q2_dispatch_comparison.svg
    png: paper/figures/fig_q2_dispatch_comparison.png
    png_dpi: 400
  baseline: FIFO cumulative facility-energy cost normalized to 100%; same input, constraints,
    and output class.
  axes:
  - variable: Hour from task horizon
    unit: h
  - variable: Cumulative facility-energy cost relative to FIFO
    unit: '%'
  caption: Cumulative facility-energy cost index over the 0--2405 h supplied horizon.
    The rolling exchange heuristic is compared with the same-input FIFO baseline normalized
    to 100%; endpoint annotation is generated from the frozen Q2 cost-change evidence.
    This comparison does not claim global optimality or separate the effect of storage
    decisions.
  panel_map:
  - panel: main
    role: primary comparison evidence
    subclaim: The bounded deterministic exchange schedule has a lower cumulative facility-energy
      cost than FIFO for the supplied horizon.
  statistics:
  - 2406 hourly observations per method after aggregation over 6 regions
  - Cumulative index = 100 * cumulative ElectricityCost_CNY(method) / cumulative ElectricityCost_CNY(FIFO)
  - Endpoint delta and all plotted values are derived from frozen JSON/CSV evidence;
    no manual values
  statistics_report:
    sample_size: 2406 hours x 6 regions per method
    center: deterministic cumulative sum; endpoint index and trajectory extrema
    interval: not applicable; no stochastic interval is plotted
    test: not applicable; paired deterministic same-input trajectory
    multiplicity: not applicable
  data_integrity:
    source_hashes:
    - path: sprints/sprint-20260808T031146908286Z/merged/solver-q2/q2_full_hourly_profiles.csv
      sha256: 129c23e73ed9d0ec7398f1a787d9426f0a8d54851a9153f3f96741871404dd47
