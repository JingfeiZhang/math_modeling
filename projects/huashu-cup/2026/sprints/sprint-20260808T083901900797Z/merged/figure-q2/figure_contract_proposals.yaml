    fields:
    - comparison_vs_fifo.cost_change_pct
  - locator: sprints/sprint-20260808T031146908286Z/merged/solver-q2/q2_full_hourly_profiles.csv:Method
      in {full_horizon_FIFO_latency_feasible_local_first,full_horizon_rolling_shadow_exchange::lagrangian_balanced};
      Hour 0--2405; Region all
    sha256: 129c23e73ed9d0ec7398f1a787d9426f0a8d54851a9153f3f96741871404dd47
    fields:
    - Method
    - Hour
    - Region
    - ElectricityCost_CNY
  - locator: sprints/sprint-20260808T031146908286Z/merged/solver-q2/q2_full_block_robustness.csv:block_id;
      cost_change_pct
    sha256: 2ac7d8a6da49d09319359317931371b7f16c7f9e872a81f2d64a11e58dfdbaa4
