  core_conclusion: The deterministic rolling exchange schedule remains below the same-input
    FIFO cumulative facility-energy cost index across the supplied horizon, with the
    endpoint tied to the frozen Q2 cost-change claim.
  core_message: A single cumulative cost index makes the full-horizon comparison readable
    while preserving the FIFO reference and the bounded-heuristic interpretation.
  evidence_chain:
  - locator: experiments/C/Q2/q2-full-compat-20260808/q2_compat_summary.json:$.comparison_vs_fifo.cost_change_pct
