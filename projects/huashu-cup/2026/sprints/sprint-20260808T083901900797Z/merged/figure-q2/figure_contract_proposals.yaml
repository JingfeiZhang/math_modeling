    meaning: deterministic rolling exchange heuristic
    secondary_encoding: solid line + circle marker
  - role: baseline
    meaning: same-input FIFO latency-feasible baseline
    secondary_encoding: dashed line + square marker
  - role: reference
    meaning: FIFO normalized index at 100%
    secondary_encoding: neutral horizontal reference line
  visual_hierarchy:
    primary_evidence: Cumulative facility-energy cost index of main schedule versus
      FIFO.
    secondary_context: FIFO=100% reference and endpoint annotation derived from frozen
      evidence.
    deemphasized: Light horizontal grid and neutral reference rule; no unneeded decorative
      layers.
  source_data:
  - sprints/sprint-20260808T031146908286Z/merged/solver-q2/q2_full_hourly_profiles.csv
