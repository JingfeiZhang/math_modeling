schema_version: 1
snapshot_date: "2026-08-11"
purpose: >-
  Pinned read-only method sources for the local visualization-design skill.
  Repository popularity is discovery evidence only, not an authority over local
  contest evidence, palette, environment, or release rules.

authoritative_local_rules:
  palette: config/figure_style.yaml#journal-spectrum-v2
  state_owner: mathmodel-skill
  formal_figure_owner: modeling-paper-studio
  export: [pdf, editable-text-svg, 400-dpi-png]
  default_primary_plotting_areas: 1

