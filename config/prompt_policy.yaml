schema_version: 1
locale: zh-CN
mode: progress-first
authority_order:
  - official_rules
  - project_contest_profile
  - prompt_policy
  - question_manifest
  - formal_evidence
  - candidate_evidence
  - scratch_evidence
  - external_literature
shared_knowledge:
  index: references/competition-knowledge/index.md
  phases: [P1, P2, P3a, P3b]
  solver_roles: [solver]
  literature_roles: [literature]
  contest_evidence_eligible: false
  formal_stages: [P4, P5, P6]
response:
  format: compact_receipt
  required_fields: [status, objective, conclusion, evidence, warnings, next_action, decision_request]
  detail_mode: on_request
stages:
  P0:
    gate: G0
    objective: 赛前预检环境、规则、模板和空项目骨架。
    allowed_actions: [preflight, tooling, template, corpus]
    blocking: [核心工具不可用, 项目骨架不可用]
    warning: [扩展依赖未安装]
    deferred: [题面解析, claims, formal证据, PDF深审, 附件审计]
    stop_conditions: [工具链通过或明确记录缺失]
    escalation_conditions: [官方规则与模板存在冲突]
    expected_artifacts: [output/_verification/preflight.json]
  P1:
    gate: G0
    objective: 解析真实题面并生成问题接口、论文骨架、数据口径和文献计划。
    allowed_actions: [initialize, problem-decomposition, semantic-contract-draft, metric-contract-draft, literature-plan, paper-skeleton]
    blocking: [题面不可读取, 无法识别实际子问题]
    warning: [字段语义待核验, 文献尚未检索, 论文尚未润色]
    deferred: [claims冻结, formal复跑, PDF深审, 附件打包]
    stop_conditions: [真实Q1到Qn已生成]
    escalation_conditions: [题面问数存在歧义, 规则覆盖不明确]
    expected_artifacts: ["state/decision_log.json", "problems/{problem}/questions/Qx/question.yaml", "problems/{problem}/questions/Qx/contracts/*", "paper/generated/question_structure.tex"]
  P2:
    gate: G1
    objective: 为每个问题取得同输出、可计算指标和可检查约束的baseline。
    allowed_actions: [run-scratch, run-candidate, quickcheck, checkpoint, metric-contract-review, fixed-input-review]
    blocking: [runner无法启动, 输入输出完全不匹配]
    warning: [单位或约束尚未完全补齐, 文献和图件未完成]
    deferred: [完整哈希, 多次确定性复跑, PDF、字体和发布审计]
    stop_conditions: [每问至少一个可运行baseline]
    escalation_conditions: [多个baseline不可比或题意无法解释]
    expected_artifacts: ["experiments/{problem}/{question}/scratch/{run-id}/probe_receipt.json", "experiments/{problem}/{question}/candidate/{run-id}/candidate_receipt.json"]
  P3a:
    gate: G1
    objective: 建立可运行主模型并获得第一版完整结果。
    allowed_actions: [model-exploration, run-scratch, run-candidate, quickcheck, algorithm-evidence-draft, scenario-coverage-review]
    blocking: [主模型无法运行, 输出类型无法与baseline对齐]
    warning: [稳健性未完成, 文献未完成, 图件未设计]
    deferred: [PDF、字体、附件和完整发布审计]
    stop_conditions: [首版结果可解释且有继续优化价值]
    escalation_conditions: [主模型与fallback存在实质权衡]
    expected_artifacts: [实验运行回执, 候选模型摘要]
  P3b:
    gate: G2
    objective: 优化瓶颈、完成关键风险探针并在60%时间附近收束模型。
    allowed_actions: [model-optimization, robustness-probe, algorithm-evidence-lock, scenario-coverage-review, checkpoint, promote]
    blocking: [核心硬约束失败, 候选不具备晋升价值]
    warning: [非关键稳健性缺口, 语言和版面未完成]
    deferred: [G5/G6发布深审]
    stop_conditions: [主模型、baseline和fallback边界明确]
    escalation_conditions: [是否锁定主模型的实质取舍]
    expected_artifacts: [candidate_receipt.json, decision proposal]
  P4:
    gate: G4
    objective: 将选定候选晋升为Formal并冻结可追溯claims。
    allowed_actions: [promote, validate-G3, freeze, validate-G4]
    blocking: [Formal清单无效, 质量合同与输入角色、模型变量、指标快照或场景结果不一致, 硬约束失败, 确定性复跑失败, claims不可追溯]
    warning: [图件Brief或文献交接未完成]
    deferred: [全文PDF视觉审计, 附件白名单深审]
    stop_conditions: [G3/G4通过且claims冻结]
    escalation_conditions: [claim范围或结论边界需要人工取舍]
    expected_artifacts: ["Formal run manifest", "results/{problem}/claims.json"]
  P5:
    gate: G5
    objective: 用冻结证据完成论文、图表和必要的Paper Evidence补证。
    allowed_actions: [paper-evidence, figure-data, figure-intent, figure-brief, figure-render, figure-qa, layout-check, build]
    blocking: [论文引用冻结证据之外的数字, 指标到claims、表格或图件的映射不一致, 摘要遗漏任一问的方法、对象、主结论、验证或边界, Paper Evidence导致主指标漂移]
    warning: [语言、图件或版面仍在调整]
    deferred: [封存和最终上传校验]
    stop_conditions: [正文主体、图表和引用闭环]
    escalation_conditions: [补证改变主结论或需改变claim边界]
    expected_artifacts: ["paper/sections/*.tex", "paper/figures/*", "paper-evidence manifest"]
  P6:
    gate: G6
    objective: 集中完成G5/G6、匿名性、白名单打包、封存和发布复核。
    allowed_actions: [audit, package, seal, verify-release, archive-work]
    blocking: [论文审计失败, PDF视觉或字体失败, 附件白名单失败, 发布哈希失败]
    warning: [非阻断文字或版面瑕疵]
    deferred: [新模型和非阻断重构]
    stop_conditions: [release验证通过]
    escalation_conditions: [多个发布修复路径会改变交付结果]
    expected_artifacts: [output/release, release manifest, submission PDF and ZIP]
rules:
  warning_does_not_block_exploration: true
  blocking_only_blocks_current_transition: true
  deferred_not_run_before_owner_stage: true
  hash_drift_invalidates_affected_question_only: true
  no_recursive_reaudit: true
roles:
  orchestrator:
    objective: 自动读取当前项目、阶段和门禁并安排下一步。
    read_scope: [contest.yaml, project.yaml, config/workflow.yaml, question.yaml, output/_verification]
    write_scope: [output/_verification/prompts]
    inputs: [project context, derived stage, question interface]
    outputs: [prompt packet, compact receipt]
    protected: [state/decision_log.json, "results/{problem}/claims.json", paper/main.tex, paper/figure_contracts.yaml, submission]
    stop_conditions: [普通任务已安排或需要根Agent决策]
    decisions: [主模型, fallback, claim范围, 规则冲突, 发布阻断]
  solver:
    objective: 推进拆题、模型、baseline、算法和实验。
    read_scope: [question.yaml, contracts, experiments, results, literature/model_evidence_brief.yaml]
    write_scope: ["experiments/{problem}/{question}", work]
    inputs: [question interface, candidate evidence, literature evidence]
    outputs: [problem semantics contract, metric contract, algorithm evidence contract, model card, run receipt, risk probes, candidate proposal]
    protected: [state/decision_log.json, "results/{problem}/claims.json", paper/figure_contracts.yaml, paper/main.tex, submission]
    stop_conditions: [baseline可比或候选停止条件满足]
    decisions: [主模型实质取舍, fallback启用, claim范围]
  literature:
    objective: 与baseline和Scratch并行完成学术文献检索、精读和模型证据综合。
    read_scope: [question.yaml, literature, work/cache/literature]
    write_scope: ["problems/{problem}/questions/{question}/literature", "work/cache/literature"]
    inputs: [question interface, search plan, experiment gap]
    outputs: [search receipt, reference card, model evidence brief]
    protected: [state/decision_log.json, "results/{problem}/claims.json", "experiments/{problem}/{question}/formal", paper/main.tex]
    stop_conditions: [时间预算到达或模型证据足够]
    decisions: [未解决文献冲突, 需改变模型选择]
  visualization:
    objective: 先决定figure/table/text/none，再形成Visual Intent和Figure Brief。
    read_scope: [figure_data_manifest.yaml, visual_intent.yaml, figure_briefs, frozen claims]
    write_scope: ["experiments/{problem}/{question}/{level}/{run-id}/figure-staging", output/_verification]
    inputs: [formal data manifest, reader question, claim and baseline]
    outputs: [visual intent, figure brief, figure QA proposal]
    protected: [state/decision_log.json, "results/{problem}/claims.json", paper/main.tex, paper/figure_contracts.yaml, paper/figures]
    stop_conditions: [设计决策完成或明确table/text/none]
    decisions: []
  paper:
    objective: 只消费冻结claims和合格Paper Evidence完成正文，按“结果—原因—意义—边界”表达，避免工程流程流水账。
    read_scope: [question.yaml, results, paper-evidence, paper/figures, literature cards and bib]
    write_scope: [paper/sections, paper/generated, paper/tables, output/_verification]
    inputs: [frozen evidence, approved briefs, citation handoff]
    outputs: [section draft, evidence locator map, compact receipt]
    protected: [state/decision_log.json, "results/{problem}/claims.json", paper/figure_contracts.yaml, submission]
    stop_conditions: [当前章节论证链闭合]
    decisions: [claim范围, 结论边界, 规则冲突]
  studio_release:
    objective: 负责正式Figure Contract、XeLaTeX、PDF、匿名性和发布审计。
    read_scope: [paper, results, output/_verification, contest.yaml]
    write_scope: [output, output/_verification, output/release, paper/figures_staging]
    inputs: [formal claims, figure QA, manuscript]
    outputs: [audit reports, release package, seal receipt]
    protected: ["experiments/{problem}/{question}/formal", "results/{problem}/claims.json", state/decision_log.json]
    stop_conditions: [G5/G6通过或阻断项明确]
    decisions: [发布阻断修复路径]
  reviewer:
    objective: 只做独立审阅并输出review JSON。
    read_scope: [project outputs, paper, formal evidence]
    write_scope: [output/_verification/reviews]
    inputs: [指定审阅对象, gate]
    outputs: [review JSON]
    protected: [state/decision_log.json, "experiments/{problem}/{question}/formal", "results/{problem}/claims.json", paper/main.tex, paper/figure_contracts.yaml, submission]
    stop_conditions: [审阅报告完成]
    decisions: []
