    unit: replace with unit or dimensionless
caption: State the object, conditions, comparison, quantitative result, uncertainty, and boundary.
panel_map:
  - panel: main
    role: Main evidence panel
    subclaim: Replace with the panel-level conclusion.
statistics:
  - Name every interval, test, aggregation, and sample size shown.
statistics_report:
  sample_size: Define n and the observational or simulation unit.
  center: Name the center statistic or state not applicable with a reason.
  interval: Name the uncertainty interval or state not applicable with a reason.
  test: Name the statistical test or state not applicable with a reason.
  multiplicity: Name the correction or state not applicable with a reason.
