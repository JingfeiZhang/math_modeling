    secondary_encoding: solid line and circle marker
visual_hierarchy:
  primary_evidence: State the mark or series that must be seen first.
  secondary_context: State the baseline, interval, or reference that supports interpretation.
  deemphasized: State which grid, background, or auxiliary series must remain quiet.
