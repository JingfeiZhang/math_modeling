schema_version: 1
competition: CUMCM
source_contract_count: 52
contract_fields: [objective, required_content, evidence_requirements, forbidden_content]
standard_profile:
  id: cumcm-standard-v1
  scope: 全国大学生数学建模竞赛中文论文
  basis:
    corpus_report: corpus/reports/cumcm-c-writing-template-2021-2025.md
    experience_report: corpus/experience_report.md
    sample_scope: 官方展示论文的页面级结构、摘要、模型链、验证链和图表证据
    transfer_rule: 迁移论证结构和证据方法，不复制论文文字、数据、图件或结论
  precedence:
    - current_official_rules
    - project_contest_profile
    - question_profile
    - this_standard_profile
    - formal_evidence
  activation:
    always: [problem_interface, model_choice, formulation, algorithm, result, validation, conclusion, citation_traceability, evidence_consistency]
    conditional: [prediction_delivery, classification_evaluation, multi_objective, physical_state, simulation, scenario_scope, uncertainty, time_series]
    not_applicable: 题面和question_profile均未触发的条件检查必须标记NOT_APPLICABLE，不得作为阻断项。
  stage_use:
    P1: 生成问题接口、任务标签和标准写作骨架
    P2: 检查同输出baseline、主要指标和最小可验证输出
    P3a_P3b: 根据激活的题型规则补齐模型竞争和专项验证
    P4: 只允许一致的Formal证据进入主张
    P5: 只消费冻结claims和合格Paper Evidence
    P6: 按当届官方规则完成全文和发布审计
  profile_contract:
    required_fields: [task_types, feature_tags, active_checks, not_applicable_checks, status, source]
    status_flow: [DRAFT, REVIEWED, READY, STALE]
# This review card is author-side guidance. It is not rendered into TeX/PDF and
# does not add a second evidence or contest-state system.
quality_review:
  objective: 将赛后评语转化为赛中可执行的语义、指标、算法证据和论文表达检查，优先排除会改变结论的问题。
  use_at:
    - P1题面拆解后建立草案
    - P2/P3每次checkpoint前快速复核
    - P4正式晋升前完成证据闭合
    - G5摘要、正文、表格和图件交付前做一致性复核
  contract_refs:
    semantics: config/schemas/semantic_contract.schema.json
    metrics: config/schemas/metric_contract.schema.json
    algorithm_evidence: config/schemas/algorithm_evidence.schema.json
    abstract: config/schemas/abstract_contract.schema.json
  checklist:
    - id: semantic_alignment
      question: 题面原句要求的对象、输入、输出和交付形式分别是什么？
      check: 每个输出都绑定题面定位、字段、单位、时间/空间粒度和上下游接口；fixed、observed、decision、derived角色不得混淆。
      failure_action: Scratch记录warning；checkpoint前补齐，固定输入被建成决策变量时阻断晋升。
    - id: metric_alignment
      question: 主指标是否就是题面要求的指标？
      check: 写明公式、方向、分子、分母、聚合方式、单位、时间范围、预测目标/步长和同输出baseline；成本、服务、碳排等题面要求不得被替代指标覆盖。
      failure_action: 缺指标、单位、分母或窗口时阻断Candidate晋升；不一致只重开受影响问题。
    - id: model_evidence
      question: 模型复杂度是否有与题型匹配的证据？
      check: 预测用时间外或滚动验证；优化用可行性、baseline、精确小实例/下界/gap或轨迹；随机启发式补充至少三种子；机理模型检查量纲、边界、守恒和极限情形。
      failure_action: P2/P3可先记录缺口继续探索；Formal前必须补齐或诚实降低结论措辞。
    - id: objective_scope
      question: 多目标和场景结论是否超过了实际搜索范围？
      check: 至少三个不同权重、epsilon或非支配方案才使用Pareto/权衡全貌表述；固定权重写成固定偏好下的单方案；标注full、sampled或local-window。
      failure_action: 未覆盖全场景时摘要、标题、结论和claim同步限制，不得外推全局或全时域。
    - id: result_consistency
      question: 摘要、正文、表格、图件和claims是否使用同一口径？
      check: 数值、单位、分母、时间范围、baseline、统计定义和claim_id来自同一冻结证据；参考范围外必须解释。
      failure_action: G4/G5阻断一致性闭合，修复最早的证据或映射，不递归重审其他问题。
    - id: abstract_coverage
      question: 摘要是否让评委不看正文也能知道每问做了什么？
      check: 首段3至4行写背景和研究对象；Q1–Qn逐段写方法、研究对象、1至2个主要结果、验证和边界；末段写贡献与限制；禁止runner、manifest、seed、hash、workflow、pipeline等内部词。
      failure_action: G5阻断；普通写作阶段只作为warning。
  content_audit:
    purpose: 检查论文是否真正回答题目并形成“题意—模型—证据—结果—意义—边界”闭环，而不是只完成章节和算法名称。
    review_order: [question_answerability, variable_assumption_closure, model_fit, evidence_sufficiency, result_interpretation, decision_value, cross_question_consistency, compression]
    levels:
      question_answerability:
        question: 读者能否从本问结尾直接找到题面要求的答案、单位、范围和交付形式？
        required: [source_requirement, output_id, unit, answer_locator, paper_location]
        warning: 题面要求已识别但结果尚未冻结。
        blocking_at: [candidate, g3, g4, g5]
      variable_assumption_closure:
        question: 关键变量、参数和假设是否同时出现在公式、程序接口和检验中？
        required: [variable_role, assumption_reason, formula_or_constraint, implementation_locator, validation_locator]
        warning: 非关键符号或假设仍待整理。
        blocking_at: [g3, g4]
      model_fit:
        question: 模型选择是否由数据、约束、规模和可解释性驱动，并与同输出baseline可比？
        required: [main_model, comparable_baseline, selection_reason, rejected_or_not_applicable_alternative, fit_evidence]
        warning: 轻量挑战模型尚未完成但主模型仍可探索。
        blocking_at: [candidate, g3, g4]
      evidence_sufficiency:
        question: 验证是否针对本模型最可能失败的环节，而非只证明程序运行成功？
        required: [failure_risk, validation_method, acceptance_rule, tested_scope, evidence_locator]
        warning: 补充敏感性、压力场景或反例尚未完成。
        blocking_at: [g3, g4]
      result_interpretation:
        question: 每个主要表图或数字是否回答“结果是什么、为什么、意味着什么”？
        required: [result_claim, cause_or_mechanism, practical_meaning, boundary_language]
        warning: 结果已有证据但解释段落尚未完成。
        blocking_at: [g5]
      decision_value:
        question: 结果是否转化为题目要求的方案、预测、排序、判断、解释或建议？
        required: [question_answer, action_or_use, conditions, failure_boundary]
        warning: 数学结果已得到但应用含义仍需压缩表达。
        blocking_at: [g5]
      cross_question_consistency:
        question: 前问输出、后问输入、摘要、正文、表图和claims是否使用相同单位与统计口径？
        required: [interface_mapping, unit_mapping, metric_mapping, claim_mapping]
        warning: 只影响单个问题的接口时局部重开，不递归重审无关问题。
        blocking_at: [g4, g5]
      compression:
        question: 是否删除工程流水账和重复展示，同时保留支撑结论所需的最小证据？
        required: [reader_question, selected_evidence_form, removed_redundancy, retained_boundary]
        warning: 内容可读性问题先记录，不阻断模型探索。
        blocking_at: [g5]
    result_sentence_pattern: 结果—原因—意义—边界
    reviewer_test:
      questions:
        - 这道题每一问到底交付了什么？
        - 为什么当前模型适合，而不是只因为算法熟悉或名称先进？
        - 为什么结果可信，验证是否针对最可能失败点？
        - 结果对题目背景有什么可执行意义？
      fail_action: 只能回答“用了什么算法”而不能回答上述问题时，不得用语言润色代替补证或改模。
  conditional_triggers:
    prediction_delivery:
      activates_if: task_types contains prediction or feature_tags contains forecast_target
      require: 直接写出预测对象、预测窗口/步长、题面评分指标、分母和题面要求的成本或服务指标；同时报告同输出baseline和时间外或滚动验证。
      forbid: 不得用容量压力、后处理收益或其他替代量代替题面预测指标，也不得把训练内拟合写成预测效果。
    classification_evaluation:
      activates_if: task_types contains classification or evaluation
      require: 写明标签/评价对象、指标方向、阈值或权重来源、误判代价及排名/分类稳定性检查。
      forbid: 不得只报告准确率或单一综合分，不得把相关性或排序直接写成因果结论。
    multi_objective:
      activates_if: task_types contains multi_objective or feature_tags contains pareto
      require: 说明目标方向、权重/epsilon/非支配方案数量和同输出baseline；参考范围外的关键指标必须报告实际值、分母、偏离方向、原因和边界。
      forbid: 不得用一个固定权重解宣称完整Pareto搜索，不得只展示有利指标或省略超出参考范围的原因。
    physical_state:
      activates_if: task_types contains mechanism or feature_tags contains physical_constraints
      require: 分别标出固定输入、外生输入、决策变量、初始状态和终端边界，并检查量纲、守恒、功率/容量边界和极限情形。
      forbid: 不得将题面固定量或边界条件重新优化，也不得以求解成功替代物理一致性检查。
    scenario_scope:
      activates_if: task_types contains scenario or feature_tags contains local_search
      require: 列出题面要求的场景与实际运行场景，逐项标记full、sampled或local-window，明确未覆盖场景和搜索预算。
      forbid: 不得把局部联合搜索外推为全时域、全场景或全局最优。
    time_series:
      activates_if: feature_tags contains temporal_data
      require: 说明时间粒度、切分方向、滚动窗口和泄漏检查；不得随机打乱具有时间顺序的数据。
      forbid: 不得把随机划分结果写成时间外预测能力。
  evidence_selection:
    rule: 不为形式强制每问一张图一张表或固定两项检验；按读者问题和最可能失败的环节选择figure、table、text或none。
    optimization: 约束审计和同输出baseline优先，随后按规模选择小实例、gap、场景或敏感性证据。
    prediction: 题面评分指标和时间外验证优先，区间预测同时报告覆盖率与区间宽度。
    mechanism: 量纲、初终边界、守恒和极限情形优先，必要时再补参数敏感性。
    evaluation: 指标方向、标准化、权重扰动和排名稳定性优先。
  wording_boundaries:
    local_window: 仅使用“局部窗口内”“在所选场景中”等措辞。
    fixed_weight: 仅使用“固定偏好下的方案”或“给定权重下的结果”。
    heuristic: 使用“近似解”“有限预算下的改进”或“经验上稳定”，除非有对应最优性证据。
    convergence: 收敛轨迹只证明算法行为，不单独证明模型有效、全局最优或业务合理。
  anti_formalism:
    - 正文篇幅服从当届官方规则，不以页数、图数、审计数量作为前期进度目标。
    - 完整源码进入白名单支撑包，正文附录只放关键代码和入口索引。
    - 没有实际证据的“先进、高效、准确、具有实际意义”不得作为结论。
sections:
  abstract:
    contract:
      objective: 让评审在第一页识别研究对象、各问方法、关键结果和可信边界。
      required_content: 首段用3至4行交代背景、研究对象、核心矛盾和总体路线；随后按真实Q1–Qn分段，每问写明研究对象、方法、1至2个带单位的冻结主结论、验证方式及适用边界；关键题面指标必须在对应问中出现；最后概括整题贡献、主要限制和可执行含义；列出三至五个领域关键词。
      evidence_requirements: 所有结果读取冻结主张；摘要中的方法名、数值、单位、基线和验证结论均能定位到正文及正式证据。
      forbidden_content: 不得只报方法不报结果，不得手填未核验数字，不得写文献综述、公式推导、图表或内部工作过程；不得把题面未要求的替代指标写成主指标；不得把局部窗口、固定权重或近似解写成全局、完整或最优结论；不得出现runner、manifest、seed、hash、workflow、pipeline等内部工程词。
  ai_statement:
    contract:
      objective: 仅在当届官方规则要求时完成真实、简明的工具披露。
      required_content: 按官方字段说明工具、版本、使用环节、人工核验和必要的详情索引。
      evidence_requirements: 披露内容与实际使用记录及提交附件一致。
      forbidden_content: 不得把该声明用于技术论证，不得夸大或隐瞒使用事实，也不得在正文与图注中重复。
  problem_restatement:
    contracts:
      background_conditions:
        heading: 研究背景与已知条件
        objective: 把题目转化为清晰、无方法倾向的研究对象和已知条件。
        required_content: 概括实际背景、对象范围、题目给定的数据或规则，以及会限制答案形式的条件。
        evidence_requirements: 以正式题面和附件字段为唯一依据，术语、单位和时间空间范围与题面一致。
        forbidden_content: 不得复制题面长段原文，不得提前介绍算法、结论、实验数字或主观扩展背景。
      question_outputs:
        heading: 子问题任务与输出
        objective: 让读者明确每一问究竟需要计算、判断、预测或优化什么。
        required_content: 按真实问数逐问说明输入、目标输出、主要约束和交付形式；题面未要求的输出不自行添加。
        evidence_requirements: 各问描述与对应 question manifest 的 problem 字段一致。
        forbidden_content: 不得保留不存在的子问题，不得用“建立合理模型”等空话替代可检查的输出。
      dependencies:
        heading: 子问题依赖关系
        objective: 说明各问是递进、共享数据还是可以并行求解。
        required_content: 指出前问哪些输出进入后问、共享哪些口径；若无依赖，明确其独立关系。
        evidence_requirements: 依赖关系与后文上下游接口及程序数据流一致。
        forbidden_content: 不得在没有题面或模型依据时虚构依赖，不得在本节展开求解流程。
  problem_analysis:
    contracts:
      overall:
        heading: 总体分析
        objective: 揭示整道题从数据到决策或解释的数学主线。
        required_content: 概括共同状态、决策对象、评价目标、硬约束和跨问数据接口，说明最主要的建模难点。
        evidence_requirements: 判断依据来自题面、数据剖析和可验证的领域关系。
        forbidden_content: 不得写成算法名称清单，不得用装饰性总流程图代替文字分析，不得展开完整公式。
      mathematical_structure:
        heading: 各问题的数学结构
        objective: 回答每一问的数学本质是什么，以及为什么需要相应类型的模型。
        required_content: 逐问说明输入输出、变量关系、目标冲突、关键约束、可选模型类别和初步选择依据。
        evidence_requirements: 模型选择须由数据特征、约束结构或已核验文献支撑，并至少说明一个不优先方案的局限。
        forbidden_content: 不得只写“采用某算法求解”，不得把后文模型公式、结果或无法核验的性能判断提前放入本章。
      interfaces:
        heading: 问题之间的衔接
        objective: 建立各问之间可执行、可核对的数据和模型接口。
        required_content: 列明传递量、单位、时间空间粒度和依赖方向，说明共享口径如何保持一致。
        evidence_requirements: 接口与各问 manifest、程序输入输出及后文符号定义互相一致。
        forbidden_content: 不得用模糊的“在前问基础上”代替具体接口，不得混用不同单位或统计口径。
  assumptions_notation:
    contracts:
      assumptions:
        heading: 模型假设
        objective: 用最少的可检验简化明确模型成立条件。
        required_content: 逐条写明假设内容、采用理由、影响的公式或约束及适用边界；在相应检验处回查关键假设。
        evidence_requirements: 每条假设都能定位到后文模型或敏感性、压力场景与误差分析。
        forbidden_content: 不得写“数据真实可靠”“忽略一切偶然因素”等空泛假设，不得把题面已知条件重复写成假设。
      notation:
        heading: 符号约定
        objective: 建立全文高频变量的统一语义和单位，降低跨问阅读成本。
        required_content: 采用“符号—含义—单位”三线表；只列跨章节或反复使用的核心符号；局部变量在首次出现的公式后解释。
        evidence_requirements: 符号、上下标、单位与公式、代码、图轴和表头一致，并通过定义覆盖检查。
        forbidden_content: 不得收录只出现一次的局部变量，不得一符多义、同义多符，也不得在附录重复符号表。
  data_processing:
    contracts:
      interface_units:
        heading: 数据接口与单位
        objective: 建立可复现的数据入口和统一计算尺度。
        required_content: 说明实际使用的字段、样本范围、时间与空间粒度、单位换算、表间关联键及各问共享接口。
        evidence_requirements: 字段和范围来自正式附件及运行清单，换算关系能够在数据准备代码中定位。
        forbidden_content: 不得复制整张原始数据表，不得使用未声明的外部数据，不得隐去会改变结果的筛选。
      missing_anomaly_features:
        heading: 缺失值、异常值与特征构造
        objective: 说明哪些处理改变了模型输入，以及这些处理为何合理。
        required_content: 报告缺失和异常的识别口径、处理比例与理由；说明标准化、聚合或特征构造的公式和单位影响。
        evidence_requirements: 所有处理由数据剖析统计和可复现脚本支撑，处理前后样本量或守恒关系可核对。
        forbidden_content: 不得为了篇幅罗列未实际执行的方法，不得把绘图美化当作数据处理，不得无依据删除异常值。
      metrics:
        heading: 评价指标与共同口径
        objective: 统一各问结果比较、误差评价和可行性判断的尺度。
        required_content: 定义指标公式、方向、单位、分子、分母、聚合方式、时间范围、基线和必要的守恒关系；预测任务补充预测对象、步长、点预测或区间定义；题型专属指标可在对应问补充。
        evidence_requirements: 指标定义与实验输出字段、表格列和冻结主张一致，参数来源可追溯。
        forbidden_content: 不得只写指标名称，不得以容量压力、后处理或替代指标代替题面主指标，不得混用平均值与总量、比例与百分点，也不得事后选择有利指标。
  question:
    required_content: [objective_interface, data_mechanism, model_choice, formulation, algorithm, result, validation, conclusion]
    heading_policy:
      mode: dynamic
      default_titles_are: suggestions_only
      responsibility_rule: 八项论证责任必须全部覆盖，但可合并、拆分、调整顺序，并使用研究对象、状态、决策或结果导向的小标题
      audit_interface: question.yaml.paper.section_map
      examples:
        prediction: [数据画像与预测目标, 滚动预测模型与时间外验证, 预测结果及误差边界]
        optimization: [决策变量与资源约束, 多目标方案与求解策略, 权衡结果及决策建议]
        mechanism: [状态变量与边界条件, 动力学关系与数值求解, 守恒检验与适用范围]
    variants:
      Q1:
        contracts:
          objective_interface: {heading: 目标与上下游接口, objective: 明确本问要回答的量化问题及其在全文中的位置。, required_content: 写明输入、输出、决策或状态变量、主要约束，以及向后续问题传递的量和单位。, evidence_requirements: 与题面、question manifest 和程序接口一致。, forbidden_content: 不得提前给结果，不得用算法名称代替问题目标。}
          data_mechanism: {heading: 数据特征或机理依据, objective: 说明模型结构由哪些数据现象或领域关系推出。, required_content: 给出直接影响建模选择的分布、趋势、相关结构、守恒关系或机理，并解释其作用。, evidence_requirements: 只使用可定位的数据剖析、题面关系或已核验来源。, forbidden_content: 不得堆放无关描述统计，不得把相关性直接写成因果关系。}
          model_choice: {heading: 模型选择与备选方案比较, objective: 论证为何当前模型适合本问，而不是简单宣布算法。, required_content: 明确主模型和同输出baseline；按本问风险、规模和时间预算选择一个轻量挑战模型或精确小实例，并说明未选择其他方案的具体理由、适用条件和代价。, evidence_requirements: 依据数据结构、约束性质、可解释性、计算规模或真实文献；性能判断必须来自可比实验或明确的理论边界。, forbidden_content: 不得固定套用某类算法，不得为了凑比较而加入不可比模型，不得用未经实验的“更准确”作为选择理由。}
          formulation: {heading: 模型建立, objective: 把题目要求转化为可计算的数学对象。, required_content: 依次定义变量和参数，给出目标或预测关系、关键约束、边界条件、单位及必要的线性化或近似。, evidence_requirements: 每个公式都与题目变量对应，参数有来源，假设在模型中有落点。, forbidden_content: 不得照抄教材通式，不得遗漏单位、变量域、边界或公式含义。}
          algorithm: {heading: 求解算法, objective: 说明模型如何被稳定、可复现地求解。, required_content: 写明输入、初始化、关键步骤、求解器或算法参数、随机种子、停止条件、运行规模、搜索范围和输出复核；若使用随机或启发式方法，报告目标轨迹和独立种子，若使用精确求解器，报告状态、gap或枚举覆盖。, evidence_requirements: 步骤对应正式 runner 和运行清单，硬约束处理可被审计，结论措辞与实际搜索范围一致。, forbidden_content: 不得粘贴大段工程代码，不得以一张收敛图单独声称模型有效、全局最优或业务合理，不得声称代码中未实现的算法或最优性。}
          result: {heading: 核心结果与解释, objective: 用最少的表图回答本问并解释形成机制。, required_content: 先给冻结核心数值、单位和同输出baseline，再根据读者问题选择必要的图、表或正文说明结构、趋势、机制或权衡；按“结果—原因—意义”解释。, evidence_requirements: 数值、单位、基线和统计定义来自冻结主张与指标合同，图表具备正式证据定位并在首次引用附近出现。, forbidden_content: 不得手填数字，不得只复述图表，不得用装饰性图件替代结果。}
          validation: {heading: 模型检验, objective: 检验本问最可能失败的环节。, required_content: 根据question_profile中激活的题型规则选择误差、可行性、守恒、基线、灵敏度、压力场景、样本外验证、交叉验证或稳健性证据；未激活规则标记NOT_APPLICABLE。, evidence_requirements: 检验口径、样本、场景、扰动范围和结论均可追溯；收敛曲线仅作算法诊断。, forbidden_content: 不得以单次运行或收敛图代替模型检验，不得只写“效果良好”。}
          conclusion: {heading: 本问结论与适用边界, objective: 以可交付答案收束本问并建立后续接口。, required_content: 概括最终答案、验证结论、成立条件、失败边界和向下一问传递的输出。, evidence_requirements: 结论只引用本问已冻结结果与边界主张。, forbidden_content: 不得增加新数值、新模型或超出场景范围的普适结论。}
