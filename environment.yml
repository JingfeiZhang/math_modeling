name: math-modeling
channels:
  - conda-forge
  - defaults
dependencies:
  # Independent fallback. Never expose another environment's site-packages.
  - python=3.13.*
  - pip
  - numpy>=2.0
  - scipy>=1.14
  - pandas>=2.2
  - sympy>=1.13
  - statsmodels>=0.14
  - scikit-learn>=1.5
  - matplotlib>=3.9
  - seaborn>=0.13
  - plotly>=5.24
  - networkx>=3.4
  - openpyxl>=3.1
  - pillow>=10.4
  - pyyaml>=6.0
  # PDF parsing is required in the independent prefix; do not rely on user-site.
  - pypdf>=5.0
  - pytest>=8.3
  - ruff>=0.6
